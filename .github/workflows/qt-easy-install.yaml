name: Install Qt 6.8.3, Docs, and MinGW Tools with aqtinstall

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  install-qt:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install aqtinstall
      run: pip install aqtinstall

    - name: Install Qt 6.8.3 (Windows, Desktop, win64_mingw)
      run: python -m aqt install-qt windows desktop 6.8.3 win64_mingw -O ${{ github.workspace }}/Qt

    - name: Install Qt 6.8.3 Documentation
      run: python -m aqt install-doc windows 6.8.3 -O ${{ github.workspace }}/Qt

    - name: Install MinGW Tools (qt.tools.win64_mingw1310)
      run: python -m aqt install-tool windows desktop qt.tools.win64_mingw1310 -O ${{ github.workspace }}/Qt

    - name: Add Qt and MinGW to PATH
      run: |
        echo "${{ github.workspace }}/Qt/6.8.3/mingw_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "${{ github.workspace }}/Qt/Tools/mingw1310/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh

    - name: Verify Qt Installation
      run: qmake --version

    - name: Verify MinGW Tools
      run: gcc --version

    - name: Zip Qt Installation
      run: Compress-Archive -Path "${{ github.workspace }}/Qt" -DestinationPath qt-install.zip
      shell: pwsh

    - name: Upload Qt Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qt-install
        path: qt-install.zip
        retention-days: 30
